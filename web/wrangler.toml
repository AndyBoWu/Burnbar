name = "burnbar-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Pin the Cloudflare account that owns andybowu.xyz so every deploy targets the
# right account even if a different CLOUDFLARE_ACCOUNT_ID is set in the shell
# (this machine has multiple Cloudflare accounts — personal vs work). This is
# the personal account that holds the andybowu.xyz zone. Account ids are not
# secret.
account_id = "0da36f4eefbf1078c5a04b966e8cd90d"

# Data-retention cron (3.5.3): runs daily at 03:00 UTC, invoking the Worker's
# scheduled() handler to purge daily_usage rows older than 90 days for
# opted-OUT users. Opted-in users retain data indefinitely.
[triggers]
crons = ["0 3 * * *"]

# Local dev / `wrangler d1 ... --local` / vitest all use a local SQLite D1 and
# need NO Cloudflare account. The real database_ids below are filled in after
# running `wrangler d1 create burnbar-staging` / `... burnbar-prod` (which DO
# need an account). See web/README.md.

[[d1_databases]]
binding = "DB"
database_name = "burnbar-local"
database_id = "local"

[env.staging]
[[env.staging.d1_databases]]
binding = "DB"
database_name = "burnbar-staging"
database_id = "REPLACE_AFTER_wrangler_d1_create_burnbar-staging"

[env.prod]
# Edge routing (3.6.2): bind only burnbar.andybowu.xyz/api/* to this API Worker.
# All other paths (the Next.js site in web/site) fall through to the Cloudflare
# Pages custom domain on burnbar.andybowu.xyz/*. The /api/* pattern is more
# specific than the Pages catch-all, so /api/v1/* hits the Worker, not Pages.
# `zone_name` is required because the route is on a zone apex/subdomain managed
# by Cloudflare DNS (3.6.1). Reachability is verified post-deploy (see README).
routes = [{ pattern = "burnbar.andybowu.xyz/api/*", zone_name = "andybowu.xyz" }]

[[env.prod.d1_databases]]
binding = "DB"
database_name = "burnbar-prod"
database_id = "REPLACE_AFTER_wrangler_d1_create_burnbar-prod"

# Rate-limiting KV (3.1.4). Create with `wrangler kv namespace create RATE_LIMIT`
# and paste the id per env; absent → the limiter fails open.
[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_AFTER_wrangler_kv_namespace_create_RATE_LIMIT_staging"

[[env.prod.kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_AFTER_wrangler_kv_namespace_create_RATE_LIMIT_prod"

# Workers Logs / analytics — powers the error-rate + last-24h-errors dashboard
# (3.1.5). Visible in the Cloudflare dashboard after deploy.
[observability]
enabled = true
head_sampling_rate = 1
