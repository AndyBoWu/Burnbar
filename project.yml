name: Burnbar
options:
  bundleIdPrefix: xyz.andybowu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
# Sparkle auto-update framework (Epic 1.6.4 — skeleton only).
# Sparkle is LINKED + embedded so the release plumbing is in place, but
# auto-update is OFF in v0: no SPUStandardUpdaterController is instantiated,
# no live SUFeedURL, and no update checks (SUEnableAutomaticChecks = NO in
# Info.plist). Enablement is deferred — see docs/RELEASING-sparkle.md.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # v0 distribution is ad-hoc signed (free). Developer ID + notarization
    # is a later decision — see docs/PLAN.md Epic 1.6.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
targets:
  # Provider-agnostic core: UsageRecord (1.2.3), parsers (1.2/1.3),
  # cost engine (1.4). Lives in a framework so it is unit-testable
  # without launching the app — keeps `xcodebuild test` host-free.
  BurnbarCore:
    type: framework
    platform: macOS
    sources:
      - Sources/BurnbarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.andybowu.BurnbarCore
        GENERATE_INFOPLIST_FILE: YES

  # Thin SwiftUI menu-bar shell. LSUIElement agent (no Dock icon).
  Burnbar:
    type: application
    platform: macOS
    sources:
      - Sources/Burnbar
    dependencies:
      - target: BurnbarCore
        embed: true
      # Sparkle is linked + embedded but inert in v0 (auto-update off).
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.andybowu.Burnbar
        PRODUCT_NAME: Burnbar
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Burnbar/Info.plist

  BurnbarCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/BurnbarCoreTests
    dependencies:
      - target: BurnbarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.andybowu.BurnbarCoreTests
        GENERATE_INFOPLIST_FILE: YES

  # Renders the real app SwiftUI views (popover, settings, menu-bar mock) to PNGs
  # via SwiftUI's `ImageRenderer` — no Screen Recording permission, no live
  # screencapture. Hosted by the Burnbar app target so `@testable import Burnbar`
  # reaches the internal views + the DEBUG-only `UsageStore` seed init (issue #177).
  # Output PNGs go to a temp dir; `Scripts/render_screenshots.sh` copies them into
  # `web/site/public/screenshots/`. Excluded from the default test scheme so a
  # normal `xcodebuild test` stays headless and host-free.
  BurnbarScreenshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/BurnbarScreenshotTests
    dependencies:
      - target: Burnbar
      - target: BurnbarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.andybowu.BurnbarScreenshotTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Burnbar.app/Contents/MacOS/Burnbar"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Burnbar:
    build:
      targets:
        Burnbar: all
        BurnbarCore: all
        BurnbarCoreTests: [test]
    run:
      config: Debug
    test:
      targets:
        - BurnbarCoreTests

  # Builds the app + the screenshot renderer and runs only the renderer test, which
  # writes the landing-page PNGs (issue #177). Kept separate from the default
  # `Burnbar` scheme so the regular test run stays headless.
  BurnbarScreenshots:
    build:
      targets:
        Burnbar: all
        BurnbarCore: all
        BurnbarScreenshotTests: [test]
    run:
      config: Debug
    test:
      targets:
        - BurnbarScreenshotTests
