name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only needs to read the checked-out code. No PR-API access required (we run the
# gitleaks binary directly rather than the action, which avoids the
# "Resource not accessible by integration" 403 on PR events).
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a secret introduced in any past commit is caught,
          # not just the diff.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks git --redact --verbose --config .gitleaks.toml --exit-code 1
